[project]
name = "firetrace"
version = "0.1.0"
description = "Modular Terminal User Interface (TUI) for Penetration Testing & Reconnaissance"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "FireTrace Team" }
]
keywords = [
    "cybersecurity",
    "penetration-testing",
    "reconnaissance",
    "tui",
    "textual",
    "nmap",
    "security-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.14.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.28.0",
]

[project.scripts]
firetrace = "app:main"
